<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time & Weather</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .time-section {
      text-align: center;
    }

    .time {
      font-size: 64px;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .date {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .weekday {
      font-size: 14px;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .weather-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .weather-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .temperature {
      font-size: 48px;
      font-weight: 200;
    }

    .temperature-unit {
      font-size: 24px;
      opacity: 0.7;
    }

    .weather-desc {
      font-size: 16px;
      opacity: 0.9;
    }

    .location {
      font-size: 14px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 12px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-value {
      font-size: 16px;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }

    .error {
      text-align: center;
      padding: 20px;
      color: #ffcccc;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .weather-icon {
      font-size: 48px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Time & Date Card -->
    <div class="card time-section">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date">Loading...</div>
      <div class="weekday" id="weekday">---</div>
    </div>

    <!-- Weather Card -->
    <div class="card weather-section">
      <div class="weather-header">
        <div class="location" id="location">
          <span>Loading location...</span>
        </div>
        <button class="refresh-btn" onclick="refreshWeather()">Refresh</button>
      </div>

      <div id="weather-content">
        <div class="loading">Loading weather data...</div>
      </div>
    </div>
  </div>

  <script>
    // Time & Date Functions
    function updateTime() {
      const now = new Date();

      // Time
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

      // Date
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

      // Weekday
      const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      document.getElementById('weekday').textContent = weekdays[now.getDay()];
    }

    // Weather icon mapping
    function getWeatherIcon(description) {
      const desc = description.toLowerCase();
      if (desc.includes('sunny') || desc.includes('clear')) return '☀️';
      if (desc.includes('cloud') || desc.includes('overcast')) return '☁️';
      if (desc.includes('rain') || desc.includes('drizzle')) return '🌧️';
      if (desc.includes('thunder') || desc.includes('storm')) return '⛈️';
      if (desc.includes('snow')) return '❄️';
      if (desc.includes('fog') || desc.includes('mist')) return '🌫️';
      if (desc.includes('partly')) return '⛅';
      return '🌡️';
    }

    // Weather Functions
    async function loadWeather() {
      const contentEl = document.getElementById('weather-content');
      const locationEl = document.getElementById('location');

      try {
        // Check if preload function is available
        if (typeof window.getWeatherInfo !== 'function') {
          contentEl.innerHTML = '<div class="error">Weather service not available (preload.js not loaded)</div>';
          return;
        }

        const weather = await window.getWeatherInfo();

        if (!weather.success) {
          contentEl.innerHTML = `<div class="error">${weather.error}</div>`;
          return;
        }

        locationEl.innerHTML = `📍 ${weather.location}`;

        contentEl.innerHTML = `
          <div class="weather-main">
            <span class="weather-icon">${getWeatherIcon(weather.description)}</span>
            <div>
              <div class="temperature">${weather.temperature}<span class="temperature-unit">°C</span></div>
              <div class="weather-desc">${weather.description}</div>
            </div>
          </div>

          <div class="weather-details">
            <div class="detail-item">
              <span class="detail-label">Feels Like</span>
              <span class="detail-value">${weather.feelsLike}°C</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Humidity</span>
              <span class="detail-value">${weather.humidity}%</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Wind</span>
              <span class="detail-value">${weather.windSpeed} km/h ${weather.windDirection}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">UV Index</span>
              <span class="detail-value">${weather.uvIndex}</span>
            </div>
          </div>
        `;
      } catch (error) {
        contentEl.innerHTML = `<div class="error">Failed to load weather: ${error.message}</div>`;
      }
    }

    function refreshWeather() {
      document.getElementById('weather-content').innerHTML = '<div class="loading">Refreshing...</div>';
      loadWeather();
    }

    // Initialize
    function init() {
      updateTime();
      setInterval(updateTime, 1000);
      loadWeather();

      // Set window height for uTools
      if (typeof utools !== 'undefined') {
        utools.setExpendHeight(400);
      }
    }

    // Start when DOM is ready
    document.addEventListener('DOMContentLoaded', init);

    // Also handle uTools plugin enter event
    if (typeof utools !== 'undefined') {
      utools.onPluginEnter(({ code, type, payload }) => {
        init();
      });
    }
  </script>
</body>
</html>
